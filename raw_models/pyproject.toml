[project]
name = "bodyexplorer-pipeline"
version = "2.0.0"
description = "Builds Body Explorer's GLB assets from BodyParts3D and Z-Anatomy"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "trimesh==5.2.0",
  "pymeshlab==2025.7.post1",
  "rtree==1.4.1",
  "networkx==3.7",
]

[dependency-groups]
dev = ["ruff==0.17.3", "pytest==9.2.0"]

[tool.ruff]
line-length = 110

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
